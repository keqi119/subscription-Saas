name: Stage1 synthetic cross-host SFTP diagnostic only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-sftp:
    if: ${{ github.repository_id == 1253231368 && github.ref == 'refs/heads/codex/stage1-sftp-diagnostic-20261026' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Freeze one synthetic diagnostic key and public descriptor
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY_ID" = 1253231368
          test "$GITHUB_REF" = refs/heads/codex/stage1-sftp-diagnostic-20261026
          test "$GITHUB_RUN_ATTEMPT" = 1
          sudo -n swapoff -a
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_WORKFLOW_REF \
            /usr/bin/prlimit --core=0:0 -- "$(command -v node)" --experimental-test-module-mocks \
            scripts/release/diagnose-r3-cross-host-sftp.mjs prepare
      - name: Publish public key descriptor only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r3-cross-host-sftp-public-key-${{ github.run_id }}-1
          path: .release-output/r3-cross-host-sftp-diagnostic/public-key.json
          if-no-files-found: error
          retention-days: 1
      - name: Exercise unchanged adapter once after H1 restricted-key setup
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_WORKFLOW_REF \
            /usr/bin/prlimit --core=0:0 -- "$(command -v node)" --experimental-test-module-mocks \
            scripts/release/diagnose-r3-cross-host-sftp.mjs run
      - name: Remove fixed local key files
        if: ${{ always() && github.repository_id == 1253231368 && github.ref == 'refs/heads/codex/stage1-sftp-diagnostic-20261026' && github.run_attempt == 1 }}
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_WORKFLOW_REF \
            /usr/bin/prlimit --core=0:0 -- "$(command -v node)" scripts/release/diagnose-r3-cross-host-sftp.mjs cleanup
      - name: Publish bounded diagnostic summary
        if: ${{ always() && github.repository_id == 1253231368 && github.ref == 'refs/heads/codex/stage1-sftp-diagnostic-20261026' && github.run_attempt == 1 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r3-cross-host-sftp-summary-${{ github.run_id }}-1
          path: |
            .release-output/r3-cross-host-sftp-diagnostic/summary.json
            .release-output/r3-cross-host-sftp-diagnostic/events.json
            .release-output/r3-cross-host-sftp-diagnostic/cleanup.json
          if-no-files-found: warn
          retention-days: 7
