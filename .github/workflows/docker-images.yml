name: Docker Images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry host, for example registry.example.com"
        required: true
        type: string
      namespace:
        description: "Registry namespace / organization"
        required: true
        type: string
      imageTag:
        description: "Image tag, for example rc-20260613-stage9 or a short SHA"
        required: true
        type: string
      apiBaseUrl:
        description: "Build-time public API base URL for the Web image; must end with exactly /api"
        required: true
        type: string
      environment:
        description: "Deployment environment for the image build"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      API_IMAGE: ${{ inputs.registry }}/${{ inputs.namespace }}/subscription-api:${{ inputs.imageTag }}
      WEB_IMAGE: ${{ inputs.registry }}/${{ inputs.namespace }}/subscription-web:${{ inputs.imageTag }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate image build inputs
        env:
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: node scripts/validate-image-build-inputs.mjs

      - name: Login to GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to custom registry
        if: inputs.registry != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          build-args: |
            API_SOURCE_REVISION=${{ github.sha }}
          tags: ${{ env.API_IMAGE }}

      - name: Verify API image revision
        shell: bash
        env:
          API_IMAGE: ${{ env.API_IMAGE }}
        run: |
          set -euo pipefail
          docker pull "$API_IMAGE"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$API_IMAGE")"
          if [ "$actual_revision" != "${GITHUB_SHA}" ]; then
            echo "API image revision label does not match the workflow commit"
            exit 1
          fi

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.apiBaseUrl }}
            NEXT_DEPLOYMENT_ID=${{ inputs.imageTag }}
          tags: ${{ env.WEB_IMAGE }}

      - name: Check Web image API base
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
        run: |
          set -euo pipefail

          rm -rf tmp-web-next
          docker pull "$WEB_IMAGE"
          container="$(docker create "$WEB_IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/apps/web/.next" ./tmp-web-next

          CHECK_ARGS=(
            --dir ./tmp-web-next
            --must-contain "$API_BASE_URL"
          )
          if [ "$DEPLOYMENT_ENVIRONMENT" = "production" ]; then
            CHECK_ARGS+=(--must-not-contain "staging-api.subauto.keybox.cloud")
          fi

          node scripts/check-web-bundle-api-base.mjs "${CHECK_ARGS[@]}"
