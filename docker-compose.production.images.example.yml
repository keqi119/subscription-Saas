# Stage 9F-D image-based production deployment example.
# The 2C/2G server should pull prebuilt API/Web images instead of building them.
# BT/Nginx owns 80/443 and proxies to API/Web on 127.0.0.1.
# Copy .env.production.images.example to .env.production.images on the server.

name: subauto-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.60
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subscription_saas_prod}
      POSTGRES_USER: ${POSTGRES_USER:-subscription_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.60
    env_file:
      - .env.production.images
    environment:
      NODE_ENV: production
      PORT: 3001
      BILLING_AUTOMATION_WORKER_ENABLED: ${BILLING_AUTOMATION_WORKER_ENABLED:-true}
      BILLING_AUTOMATION_WORKER_CONCURRENCY: ${BILLING_AUTOMATION_WORKER_CONCURRENCY:-1}
      BILLING_AUTOMATION_WORKER_LEASE_MS: ${BILLING_AUTOMATION_WORKER_LEASE_MS:-120000}
      BILLING_AUTOMATION_WORKER_POLL_INTERVAL_MS: ${BILLING_AUTOMATION_WORKER_POLL_INTERVAL_MS:-5000}
      AUTO_DEBIT_ENABLED: ${AUTO_DEBIT_ENABLED:-false}
      AUTO_DEBIT_RUN_TIME: ${AUTO_DEBIT_RUN_TIME:-09:00}
      SUBSCRIPTION_JOURNEY_ENABLED: ${SUBSCRIPTION_JOURNEY_ENABLED:-false}
      SUBSCRIPTION_JOURNEY_WORKER_ENABLED: ${SUBSCRIPTION_JOURNEY_WORKER_ENABLED:-false}
      SUBSCRIPTION_JOURNEY_POLL_INTERVAL_MS: ${SUBSCRIPTION_JOURNEY_POLL_INTERVAL_MS:-5000}
      SUBSCRIPTION_JOURNEY_CLAIM_LIMIT: ${SUBSCRIPTION_JOURNEY_CLAIM_LIMIT:-10}
      SUBSCRIPTION_JOURNEY_LEASE_MS: ${SUBSCRIPTION_JOURNEY_LEASE_MS:-120000}
      SUBSCRIPTION_JOURNEY_ALLOWLIST_CUSTOMER_IDS: ${SUBSCRIPTION_JOURNEY_ALLOWLIST_CUSTOMER_IDS:-}
      SUBSCRIPTION_JOURNEY_ALLOWLIST_APPLICATION_IDS: ${SUBSCRIPTION_JOURNEY_ALLOWLIST_APPLICATION_IDS:-}
      ESIGN_PROVIDER: ${ESIGN_PROVIDER:-fadada}
      FADADA_ENV: ${FADADA_ENV:-production}
      FADADA_BASE_URL: ${FADADA_BASE_URL:-}
      FADADA_APP_ID: ${FADADA_APP_ID:-}
      FADADA_APP_SECRET: ${FADADA_APP_SECRET:-}
      FADADA_SIGN_NOTIFY_URL: ${FADADA_SIGN_NOTIFY_URL:-}
      FADADA_SIGN_RETURN_URL: ${FADADA_SIGN_RETURN_URL:-}
      FADADA_TEST_LOCAL_CUSTOMER_ID: ${FADADA_TEST_LOCAL_CUSTOMER_ID:-}
      FADADA_TEST_CUSTOMER_ID: ${FADADA_TEST_CUSTOMER_ID:-}
      PAYMENT_DEFAULT_CHANNEL: ${PAYMENT_DEFAULT_CHANNEL:-WECHAT_JSAPI}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-true}
      WECHAT_PAY_DEFAULT_CHANNEL: ${WECHAT_PAY_DEFAULT_CHANNEL:-WECHAT_JSAPI}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_APP_SECRET: ${WECHAT_PAY_APP_SECRET:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${WECHAT_PAY_MERCHANT_SERIAL_NO:-}
      WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH: ${WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_PLATFORM_CERT_PATH: ${WECHAT_PAY_PLATFORM_CERT_PATH:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-wechat_official_account}
      NOTIFICATION_WECHAT_ENABLED: ${NOTIFICATION_WECHAT_ENABLED:-false}
      WECHAT_OFFICIAL_ACCOUNT_APP_ID: ${WECHAT_OFFICIAL_ACCOUNT_APP_ID:-}
      WECHAT_OFFICIAL_ACCOUNT_APP_SECRET: ${WECHAT_OFFICIAL_ACCOUNT_APP_SECRET:-}
      WECHAT_TEMPLATE_APPLICATION_PROGRESS: ${WECHAT_TEMPLATE_APPLICATION_PROGRESS:-}
      WECHAT_TEMPLATE_FINAL_PLAN_PENDING: ${WECHAT_TEMPLATE_FINAL_PLAN_PENDING:-}
      WECHAT_TEMPLATE_CONTRACT_PENDING: ${WECHAT_TEMPLATE_CONTRACT_PENDING:-}
      WECHAT_TEMPLATE_PAYMENT_PENDING: ${WECHAT_TEMPLATE_PAYMENT_PENDING:-}
      STAGE1_ACCEPTANCE_CONTRACT_TEMPLATE_ID: ${STAGE1_ACCEPTANCE_CONTRACT_TEMPLATE_ID:-}
      STAGE1_ACCEPTANCE_PAYER_OPENID: ${STAGE1_ACCEPTANCE_PAYER_OPENID:-}
      STAGE1_ACCEPTANCE_TEST_APPLICATION_ID: ${STAGE1_ACCEPTANCE_TEST_APPLICATION_ID:-}
      STAGE1_ACCEPTANCE_TEST_VEHICLE_ID: ${STAGE1_ACCEPTANCE_TEST_VEHICLE_ID:-}
      STAGE1_ACCEPTANCE_TEST_VEHICLE_CONFIRMED_NON_OPERATIONAL: ${STAGE1_ACCEPTANCE_TEST_VEHICLE_CONFIRMED_NON_OPERATIONAL:-false}
      STAGE1_ACCEPTANCE_MAX_PAYMENT_FEN: ${STAGE1_ACCEPTANCE_MAX_PAYMENT_FEN:-}
      STAGE1_ACCEPTANCE_MAX_REFUND_FEN: ${STAGE1_ACCEPTANCE_MAX_REFUND_FEN:-}
      PAYMENT_MANDATE_PROVIDER: ${PAYMENT_MANDATE_PROVIDER:-disabled}
      PAYMENT_MANDATE_MOCK_ENABLED: ${PAYMENT_MANDATE_MOCK_ENABLED:-false}
      WECHAT_AUTO_RENEW_TEMPLATE_ID: ${WECHAT_AUTO_RENEW_TEMPLATE_ID:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-10000}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-30000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      API_JSON_BODY_LIMIT: ${API_JSON_BODY_LIMIT:-5mb}
      UPLOAD_STORAGE_DRIVER: ${UPLOAD_STORAGE_DRIVER:-oss}
      UPLOAD_LOCAL_DIR: ${UPLOAD_LOCAL_DIR:-/app/uploads}
      LOCAL_FILE_STORAGE_DIR: ${UPLOAD_LOCAL_DIR:-/app/uploads}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PREFIX: ${OSS_PREFIX:-subscription-saas/production}
      OSS_INTERNAL_ENDPOINT: ${OSS_INTERNAL_ENDPOINT:-}
      OSS_SIGNED_URL_EXPIRES_SECONDS: ${OSS_SIGNED_URL_EXPIRES_SECONDS:-300}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    volumes:
      - production_api_uploads:${UPLOAD_LOCAL_DIR:-/app/uploads}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.60
    env_file:
      - .env.production.images
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  production_postgres_data:
  production_api_uploads:
