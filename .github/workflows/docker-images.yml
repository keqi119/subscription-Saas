name: Docker Images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry host, for example registry.example.com"
        required: true
        type: string
      namespace:
        description: "Registry namespace / organization"
        required: true
        type: string
      imageTag:
        description: "Discovery tag for this immutable build; never used as release identity"
        required: true
        type: string
      apiBaseUrl:
        description: "Build-time public API base URL for the Web image; must end with exactly /api"
        required: true
        type: string
      environment:
        description: "Deployment environment for the image build"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: trusted-image-build
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Freeze the trusted source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Validate immutable build inputs
        env:
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: node scripts/validate-image-build-inputs.mjs

  build-api:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      index-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout the frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to custom registry
        if: inputs.registry != 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Record API image repository
        id: identity
        shell: bash
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.namespace }}/subscription-api
        run: echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push attested API image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: API_SOURCE_REVISION=${{ needs.prepare.outputs.source-sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.source-sha }}
          tags: ${{ steps.identity.outputs.image }}:${{ inputs.imageTag }}

  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      index-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout the frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to custom registry
        if: inputs.registry != 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Record Web image repository
        id: identity
        shell: bash
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.namespace }}/subscription-web
        run: echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push attested Web image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: |
            WEB_SOURCE_REVISION=${{ needs.prepare.outputs.source-sha }}
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.apiBaseUrl }}
            NEXT_DEPLOYMENT_ID=${{ inputs.imageTag }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.source-sha }}
          tags: ${{ steps.identity.outputs.image }}:${{ inputs.imageTag }}

      - name: Check the Web image API base by immutable digest
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          WEB_IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d)"
          container=""
          cleanup() {
            if [ -n "$container" ]; then docker rm -f "$container" >/dev/null 2>&1 || true; fi
            rm -rf -- "$temporary_directory"
          }
          trap cleanup EXIT
          docker pull "$WEB_IMAGE"
          container="$(docker create "$WEB_IMAGE")"
          docker cp "$container:/app/apps/web/.next" "$temporary_directory/next"
          check_args=(--dir "$temporary_directory/next" --must-contain "$API_BASE_URL")
          if [ "$DEPLOYMENT_ENVIRONMENT" = "production" ]; then
            check_args+=(--must-not-contain "staging-api.subauto.keybox.cloud")
          fi
          node scripts/check-web-bundle-api-base.mjs "${check_args[@]}"

  build-runner:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      index-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout the frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to custom registry
        if: inputs.registry != 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Record Runner image repository
        id: identity
        shell: bash
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.namespace }}/subscription-runner
        run: echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push attested Runner image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.runner
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: RUNNER_SOURCE_REVISION=${{ needs.prepare.outputs.source-sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.source-sha }}
          tags: ${{ steps.identity.outputs.image }}:${{ inputs.imageTag }}

  observe-build-materials:
    needs: [prepare, build-api, build-web, build-runner]
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: trusted-image-build
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout the frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Docker Buildx for registry observation
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to custom registry
        if: inputs.registry != 'ghcr.io'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Install the fixed repository dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Verify repository contracts and compute their digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-output
          pnpm release:contracts:verify | tee .release-output/repository-contract-result.json

      - name: Resolve registry subjects and attestation manifests
        shell: bash
        env:
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          API_INDEX_DIGEST: ${{ needs.build-api.outputs.index-digest }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          WEB_INDEX_DIGEST: ${{ needs.build-web.outputs.index-digest }}
          RUNNER_IMAGE: ${{ needs.build-runner.outputs.image }}
          RUNNER_INDEX_DIGEST: ${{ needs.build-runner.outputs.index-digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
          BUILD_EVENT_NAME: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RUN_REF: github://${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFile } from "node:child_process";
          import { readFile, writeFile } from "node:fs/promises";
          import { promisify } from "node:util";
          import { canonicalJson, sha256Canonical } from "./packages/release-foundation/src/index.mjs";

          const run = promisify(execFile);
          const policy = JSON.parse(await readFile("release/contracts/build-material-policy.v1.json", "utf8"));
          const contracts = JSON.parse(await readFile(".release-output/repository-contract-result.json", "utf8"));
          const definitions = [
            ["api", process.env.API_IMAGE, process.env.API_INDEX_DIGEST],
            ["web", process.env.WEB_IMAGE, process.env.WEB_INDEX_DIGEST],
            ["runner", process.env.RUNNER_IMAGE, process.env.RUNNER_INDEX_DIGEST]
          ];
          const platformDigest = async (reference, declaredDigest) => {
            const raw = (await run("docker", ["buildx", "imagetools", "inspect", "--raw", `${reference}@${declaredDigest}`], { maxBuffer: 16 * 1024 * 1024 })).stdout;
            const manifest = JSON.parse(raw);
            if (!Array.isArray(manifest.manifests)) return declaredDigest;
            const platform = manifest.manifests.find((entry) => entry.platform?.os === "linux" && entry.platform?.architecture === "amd64");
            if (!platform?.digest) throw new Error("BUILD_BASE_IMAGE_UNPROVEN");
            return platform.digest;
          };
          const materialList = (provenance) => provenance.materials ?? provenance.resolvedDependencies ?? provenance.buildDefinition?.resolvedDependencies ?? provenance.predicate?.materials ?? provenance.predicate?.buildDefinition?.resolvedDependencies ?? [];
          const baseRepository = (baseImage) => {
            const lastSlash = baseImage.lastIndexOf("/");
            const lastColon = baseImage.lastIndexOf(":");
            return lastColon > lastSlash ? baseImage.slice(0, lastColon) : baseImage;
          };
          const materialMatches = (material, baseImage, resolvedDigest) => {
            const repository = baseRepository(baseImage);
            const uri = String(material?.uri ?? "");
            const digestValues = Object.values(material?.digest ?? {});
            return (uri.startsWith(`pkg:docker/${repository}@`) || uri.includes(`/${repository}@`))
              && (digestValues.includes(resolvedDigest.replace(/^sha256:/u, "")) || uri.includes(resolvedDigest));
          };
          const images = [];
          for (const [name, image, indexDigest] of definitions) {
            if (!/^sha256:[0-9a-f]{64}$/u.test(indexDigest ?? "")) throw new Error("BUILD_REGISTRY_DIGEST_REQUIRED");
            const raw = (await run("docker", ["buildx", "imagetools", "inspect", "--raw", `${image}@${indexDigest}`], { maxBuffer: 16 * 1024 * 1024 })).stdout;
            const index = JSON.parse(raw);
            const platform = index.manifests?.find((entry) => entry.platform?.os === "linux" && entry.platform?.architecture === "amd64");
            if (!platform?.digest) throw new Error("BUILD_PLATFORM_SUBJECT_MISSING");
            const attestation = index.manifests.find((entry) => entry.annotations?.["vnd.docker.reference.type"] === "attestation-manifest" && entry.annotations?.["vnd.docker.reference.digest"] === platform.digest);
            if (!attestation?.digest) throw new Error("BUILD_ATTESTATION_REQUIRED");
            const subject = `${image}@${platform.digest}`;
            const provenanceRaw = (await run("docker", ["buildx", "imagetools", "inspect", `${image}@${indexDigest}`, "--format", "{{json .Provenance.SLSA}}"], { maxBuffer: 16 * 1024 * 1024 })).stdout.trim();
            const provenance = JSON.parse(provenanceRaw);
            const materials = materialList(provenance);
            const builderName = provenance.buildType ?? provenance.predicate?.buildType ?? provenance.runDetails?.builder?.id ?? provenance.builder?.id;
            if (!Array.isArray(materials) || materials.length === 0 || typeof builderName !== "string" || builderName.length === 0) {
              throw new Error("BUILD_BUILDER_PROVENANCE_REQUIRED");
            }
            const baseImageDigests = [];
            for (const baseImage of policy.requiredBaseImagesByArtifact[name]) {
              const declaredDigest = policy.baseImages[baseImage];
              const digest = await platformDigest(baseImage, declaredDigest);
              if (!materials.some((material) => materialMatches(material, baseImage, digest))) {
                throw new Error("BUILD_BASE_IMAGE_UNPROVEN");
              }
              baseImageDigests.push({ image: baseImage, declaredDigest, digest });
            }
            await run("docker", ["pull", "--platform", "linux/amd64", subject], { maxBuffer: 16 * 1024 * 1024 });
            const sourceRevision = (await run("docker", ["image", "inspect", "--format", '{{ index .Config.Labels "org.opencontainers.image.revision" }}', subject])).stdout.trim();
            images.push({
              name,
              image,
              platform: "linux/amd64",
              digest: platform.digest,
              sourceRevision,
              baseImageDigests,
              builderName,
              buildAttestationRef: `oci://${subject}#provenance=${attestation.digest}`,
              registrySubject: subject,
              buildRunRef: process.env.BUILD_RUN_REF
            });
          }
          const input = {
            context: {
              eventName: process.env.BUILD_EVENT_NAME,
              ref: process.env.BUILD_REF,
              runAttempt: Number(process.env.BUILD_RUN_ATTEMPT),
              sourceSha: process.env.SOURCE_SHA,
              checkoutRef: process.env.SOURCE_SHA,
              ciRunRef: process.env.BUILD_RUN_REF,
              protectedEnvironment: policy.trustedBuild.protectedEnvironment
            },
            repositoryContractDigest: contracts.repositoryContractDigest,
            migrationCatalogDigest: contracts.migrationCatalogDigest,
            images,
            externalActions: Object.entries(policy.externalActions).map(([name, commitSha]) => ({ name, commitSha })),
            builder: {
              name: images[0]?.builderName,
              provenanceRef: `build-material-attestations:${sha256Canonical(images.map(({ buildAttestationRef }) => buildAttestationRef).sort())}`
            },
            observedAt: new Date().toISOString()
          };
          await writeFile(".release-output/build-material-input.v1.json", `${canonicalJson(input)}\n`, { flag: "wx" });
          NODE

      - name: Verify and freeze the build material observation
        run: node scripts/release/verify-build-materials.mjs --input .release-output/build-material-input.v1.json --output .release-output/build-material-observation.v1.json
