# Stage 9F-C2 BT/Nginx staging reverse proxy example.
# If BT Panel manages certificates, copy only the location/proxy blocks into the BT site config.
# Replace certificate paths before using this file directly.

server {
    listen 80;
    server_name staging-admin.subauto.keybox.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging-admin.subauto.keybox.cloud;

    ssl_certificate     <PATH_TO_CERT>;
    ssl_certificate_key <PATH_TO_KEY>;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name staging-api.subauto.keybox.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging-api.subauto.keybox.cloud;

    ssl_certificate     <PATH_TO_CERT>;
    ssl_certificate_key <PATH_TO_KEY>;

    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
