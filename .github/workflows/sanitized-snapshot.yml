name: Protected sanitized snapshot

on:
  workflow_dispatch:
    inputs:
      dispatchAuthorizationBase64:
        description: Canonical dispatch authorization body in base64
        required: true
        type: string

concurrency:
  group: stage1-snapshot-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admission:
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      admission_ref: ${{ steps.admission.outputs.admission_ref }}
      runner_labels: ${{ steps.admission.outputs.runner_labels }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: admission
        env:
          STAGE1_DISPATCH_AUTHORIZATION_BASE64: ${{ inputs.dispatchAuthorizationBase64 }}
          STAGE1_ENVIRONMENT_POLICY_DIGEST: ${{ vars.STAGE1_SNAPSHOT_ENVIRONMENT_POLICY_DIGEST }}
        run: node scripts/release/prepare-snapshot-admission.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snapshot-admission
          path: .release-output/snapshot-admission.v1.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30

  snapshot-data:
    needs: admission
    runs-on: ${{ fromJSON(needs.admission.outputs.runner_labels) }}
    environment: stage1-snapshot-export
    timeout-minutes: 25
    permissions:
      contents: none
    container:
      image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    env:
      STAGE1_SNAPSHOT_ADMISSION_REF: ${{ needs.admission.outputs.admission_ref }}
    steps:
      - run: /entry/node /entry/snapshot-h1-job-client.mjs --admission-ref "$STAGE1_SNAPSHOT_ADMISSION_REF"

  snapshot-custody:
    needs: snapshot-data
    runs-on: ubuntu-latest
    environment: stage1-snapshot-custody
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - env:
          STAGE1_DISPATCH_AUTHORIZATION_BASE64: ${{ inputs.dispatchAuthorizationBase64 }}
          STAGE1_SNAPSHOT_ACCESS_POLICY_DIGEST: ${{ vars.STAGE1_SNAPSHOT_ACCESS_POLICY_DIGEST }}
        run: node scripts/release/snapshot-custody-job.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snapshot-custody
          path: .release-output/snapshot-*.json
          overwrite: false
          if-no-files-found: error
          retention-days: 90
