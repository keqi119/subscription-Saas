name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subscription_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subscription_saas_test?schema=public
      DATABASE_POOL_MAX: 10
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: 10000
      DATABASE_POOL_IDLE_TIMEOUT_MS: 30000
      JWT_SECRET: test-jwt-secret-for-ci-only
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      API_JSON_BODY_LIMIT: 5mb
      LOCAL_FILE_STORAGE_DIR: ./uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: VehicleModel enum freeze
        run: pnpm vehicle-model:enum-freeze

      - name: Prisma validate
        run: pnpm prisma:validate

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm -r lint

      - name: API typecheck
        run: pnpm --filter @subscription-saas/api typecheck

      - name: Web typecheck
        run: pnpm --filter @subscription-saas/web typecheck

      - name: Web tests
        run: pnpm --filter @subscription-saas/web test

      - name: Apply migrations
        run: pnpm --filter @subscription-saas/api prisma:migrate:deploy

      - name: Migration status
        run: pnpm --filter @subscription-saas/api prisma:migrate:status

      - name: API tests
        run: pnpm --filter @subscription-saas/api test

      - name: Release check
        run: pnpm release:check
