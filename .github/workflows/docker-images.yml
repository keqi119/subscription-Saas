name: Docker Images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry host, for example registry.example.com"
        required: true
        type: string
      namespace:
        description: "Registry namespace / organization"
        required: true
        type: string
      image_tag:
        description: "Image tag, for example rc-20260613-stage9 or a short SHA"
        required: true
        type: string
      next_public_api_base_url:
        description: "Build-time public API base URL for the Web image"
        required: true
        default: "https://staging-api.subauto.keybox.cloud/api"
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.namespace }}/subscription-api:${{ inputs.image_tag }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.next_public_api_base_url }}
          tags: ${{ inputs.registry }}/${{ inputs.namespace }}/subscription-web:${{ inputs.image_tag }}
