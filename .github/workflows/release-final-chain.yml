name: Stage1 S1 final chain

on:
  workflow_call:
    inputs:
      chain:
        required: true
        type: string
      artifactSuffix:
        required: true
        type: string
      creationSpec:
        required: true
        type: string
      buildProofDigestHex:
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  execute:
    if: inputs.chain == 'fresh' || inputs.chain == 'snapshot'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: trusted-release-execution
    env:
      CHAIN: ${{ inputs.chain }}
      WORKFLOW_RUN_REF: github://${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@11.4.0 --activate && pnpm install --frozen-lockfile
      - name: Prepare the ephemeral hosted isolation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = keqi119/subscription-Saas
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cryptsetup-bin dmsetup e2fsprogs openssh-client
          sudo systemctl mask --runtime --now docker.service docker.socket containerd.service
          test ! -e /run/containerd/containerd.sock
          test ! -L /run/containerd/containerd.sock
          sudo swapoff --all
          test "$(wc -l < /proc/swaps)" -eq 1
          for directory in /dev/shm/stage1-keys /var/lib/stage1-snapshots /srv/stage1-snapshot; do
            test ! -e "$directory"
            test ! -L "$directory"
            sudo install -d -o root -g root -m 0700 "$directory"
          done
          for binary in /usr/bin/dockerd /usr/bin/containerd /usr/sbin/cryptsetup /usr/sbin/losetup /usr/sbin/mkfs.ext4 /usr/bin/findmnt /usr/bin/lsblk /usr/bin/sftp /usr/bin/ssh; do
            test -x "$binary"
          done
      - id: prepare-job
        name: Freeze the current hosted job and its public attestation input
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_CREATION_SPEC: ${{ inputs.creationSpec }}
          BUILD_PROOF_DIGEST_HEX: ${{ inputs.buildProofDigestHex }}
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=CHAIN,GH_TOKEN,FINAL_CREATION_SPEC,BUILD_PROOF_DIGEST_HEX,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,GITHUB_WORKFLOW_REF,RUNNER_OS,RUNNER_NAME \
            /bin/bash -ceu 'ulimit -S -c 0; ulimit -H -c 0; exec "$1" --input-type=module' stage1-root "$(command -v node)" >> "$GITHUB_OUTPUT" <<'NODE'
          import { mkdir, chmod, open, readFile } from "node:fs/promises";
          import { prepareR3FinalFreshHostedJob, prepareR3FinalSnapshotHostedJob } from "./scripts/release/r3-operation-inputs.mjs";
          const creationSpecBytes = Buffer.from(process.env.FINAL_CREATION_SPEC, "utf8");
          const spec = JSON.parse(creationSpecBytes);
          if (!/^[0-9a-f]{64}$/.test(process.env.BUILD_PROOF_DIGEST_HEX ?? "") ||
              spec.buildProofDigest !== `sha256:${process.env.BUILD_PROOF_DIGEST_HEX}` ||
              spec.sourceSha !== process.env.GITHUB_SHA || spec.phase !== "final" || spec.chain !== process.env.CHAIN) throw new Error("R3_WORKFLOW_CANDIDATE_MISMATCH");
          const prepare = process.env.CHAIN === "fresh" ? prepareR3FinalFreshHostedJob : prepareR3FinalSnapshotHostedJob;
          const job = await prepare({ repoRoot: process.cwd(), creationSpecBytes });
          // Publish only this non-secret description; the original and keys stay in tmpfs.
          await mkdir(".release-inputs", { mode: 0o755 });
          await mkdir(".release-inputs/r3-final", { mode: 0o755 });
          await chmod(".release-inputs", 0o755);
          await chmod(".release-inputs/r3-final", 0o755);
          const file = ".release-inputs/r3-final/job-admission.json";
          const handle = await open(file, "wx", 0o644);
          try { await handle.chmod(0o644); await handle.writeFile(job.jobAdmissionBytes); await handle.sync(); }
          finally { await handle.close(); }
          if (!(await readFile(file)).equals(job.jobAdmissionBytes)) throw new Error("R3_JOB_PUBLIC_COPY_MISMATCH");
          process.stdout.write(`operation-ref=${spec.operationRef}\nartifact-name=${job.artifactName}\n`);
          NODE
      - id: attest-job
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .release-inputs/r3-final/job-admission.json
      - id: upload-job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.prepare-job.outputs.artifact-name }}
          path: .release-inputs/r3-final/job-admission.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 180
          overwrite: false
          compression-level: 0
      - name: Execute final migration, database tests, API and Web through verified CLOSED
        env:
          OPERATION_REF: ${{ steps.prepare-job.outputs.operation-ref }}
        shell: bash
        run: |
          set -euo pipefail
          # H1 imports the attested job artifact and starts its fixed owner caller.
          # The hosted caller waits for that independent process; it cannot ACK for the owner.
          sudo --preserve-env=CHAIN,OPERATION_REF,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,GITHUB_WORKFLOW_REF,RUNNER_OS,RUNNER_NAME \
            /bin/bash -ceu 'ulimit -S -c 0; ulimit -H -c 0; exec "$1" --input-type=module' stage1-root "$(command -v node)" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { runR3FinalFreshHosted, runR3FinalSnapshotHosted } from "./scripts/release/run-r3-source-fresh.mjs";
          import { encodeManualJson } from "./packages/release-foundation/src/manual-stage1-contracts.mjs";
          import { sha256Bytes } from "./packages/release-foundation/src/digest.mjs";
          const run = process.env.CHAIN === "fresh" ? runR3FinalFreshHosted : runR3FinalSnapshotHosted;
          const result = await run({ repoRoot: process.cwd(), operationRef: process.env.OPERATION_REF });
          const file = `${process.cwd()}/.release-output/final-${process.env.CHAIN}/final-native-${process.env.CHAIN}.v1.json`;
          const bytes = await readFile(file);
          if (result.status !== "CLOSED" || result.finalNativeEvidenceFile !== file ||
              result.finalNativeEvidenceDigest !== sha256Bytes(bytes) ||
              !encodeManualJson(result.finalNativeEvidence).equals(bytes)) throw new Error("R3_FINAL_PUBLIC_RESULT_MISMATCH");
          process.stdout.write(`Final ${process.env.CHAIN} CLOSED: ${result.sessionRecordDigest}\n`);
          NODE
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .release-output/final-${{ inputs.chain }}/final-native-${{ inputs.chain }}.v1.json
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc-final-${{ inputs.chain }}-${{ inputs.artifactSuffix }}
          path: .release-output/final-${{ inputs.chain }}/final-native-${{ inputs.chain }}.v1.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 180
          overwrite: false
          compression-level: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rc-final-${{ inputs.chain }}-${{ inputs.artifactSuffix }}
          path: .release-readback/final-${{ inputs.chain }}
      - name: Freeze final custody including authenticated attempt history
        env:
          STORE_REF: ${{ steps.upload.outputs.artifact-url }}
          ATTESTATION_REF: ${{ steps.attest.outputs.attestation-url }}
        run: |
          sudo "$(command -v node)" scripts/release/workflow-custody-record.mjs \
            --original-file .release-output/final-${{ inputs.chain }}/final-native-${{ inputs.chain }}.v1.json \
            --readback-file .release-readback/final-${{ inputs.chain }}/final-native-${{ inputs.chain }}.v1.json \
            --workflow-run-ref "$WORKFLOW_RUN_REF" --store-ref "$STORE_REF" \
            --attestation-ref "$ATTESTATION_REF" \
            --output-file .release-output/final-${{ inputs.chain }}/final-native-${{ inputs.chain }}-custody-record.v1.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc-final-${{ inputs.chain }}-custody-${{ inputs.artifactSuffix }}
          path: .release-output/final-${{ inputs.chain }}/final-native-${{ inputs.chain }}-custody-record.v1.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 180
          overwrite: false
